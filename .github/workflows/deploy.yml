name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Download Clash Display from Fontshare
        run: |
          curl -fsSL -o clash-display.zip "https://api.fontshare.com/v2/fonts/download/clash-display"
          unzip -q -j clash-display.zip "*/ClashDisplay-Variable.woff2" -d clash-display
          mv clash-display/ClashDisplay-Variable.woff2 public/fonts/clash-display-variable.woff2
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /TSA
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
